<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
.pr-arc{transition:stroke-dashoffset 420ms cubic-bezier(.2,.8,.2,1)}
.pr-page{animation:fk-squeeze 900ms cubic-bezier(.65,0,.35,1) infinite}
.pr-beam{position:absolute;left:0;right:0;height:40%;background:linear-gradient(to bottom,transparent,rgba(121,162,255,.35),transparent);animation:beam 900ms cubic-bezier(.65,0,.35,1) infinite}
@keyframes beam{from{top:-40%}to{top:100%}}
.sd{height:6px;flex:1;border-radius:3px;background:var(--fk-line-strong);transition:background-color 300ms ease}

@media (prefers-reduced-motion: reduce){.pr-page,.pr-beam,.sd.now{animation:none}.pr-beam{display:none}}
</style>
</helmet>

<main class="fk-body fk-stack in-fade" style="align-items: center; justify-content: center; gap: 28px; padding-bottom: 40px">

<span aria-hidden="true" style="position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(closest-side, var(--fk-accent-glow), transparent); opacity: .7"></span>
<svg width="236" height="236" viewBox="0 0 236 236" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
<circle cx="118" cy="118" r="108" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"></circle>
<circle class="pr-arc" cx="118" cy="118" r="108" fill="none" stroke="#79a2ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="678.6" style="stroke-dashoffset: {{off}}; filter: drop-shadow(0 0 6px rgba(121,162,255,.7))"></circle>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { page: 3 };
    this.nextEl = null;
  }
  componentDidMount() {
    this.run();
  }
  run() {
    this.setState({ page: 1 });
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      const p = this.state.page + 1;
      if (p > 12) {
        clearInterval(this.timer);
        this.done = setTimeout(() => {
          if (this.nextEl) this.nextEl.click();
          this.done = setTimeout(() => this.run(), 1600);
        }, 500);
        return;
      }
      this.setState({ page: p });
    }, 420);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.done);
  }
  renderVals() {
    const page = this.state.page;
    const pct = Math.round((page / 12) * 100);
    const segs = [];
    for (let i = 1; i <= 12; i++) segs.push({ cls: i < page ? 'done' : i === page ? (page === 12 ? 'done' : 'now') : '' });
    return {
      page, pct, segs,
      off: (678.6 * (1 - pct / 100)).toFixed(1),
      setNext: (el) => { this.nextEl = el; }
    };
  }
}
</script>
