<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Text suchen – Treffer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
<link rel="stylesheet" href="./filekit-ergaenzung.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
.hits{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:2px;margin:0 -4px}
.hits::-webkit-scrollbar{display:none}
</style>
</helmet>
<div class="fk-app">
<header class="fk-top" aria-hidden="true">
<div class="fk-top-row"><span></span><div class="fk-top-title"><b>Stellen schwärzen</b><span>Schritt 2 von 3</span></div><span></span></div>
<div class="fk-progress"><i style="width: 66.6%"></i></div>
</header>
<div aria-hidden="true" style="flex: 1; display: flex; justify-content: center; padding-top: 12px">
<div class="canvas-vp" style="width: 331px; height: 468px"><div class="doc" style="padding: 9% 8%; gap: 7px"><div class="ln h" style="width: 48%"></div><div class="ln"></div><div class="ln" style="width: 94%"></div><div class="ln" style="width: 62%"></div><div class="gap"></div><div class="ln d" style="width: 30%"></div><div class="ln"></div><div class="ln" style="width: 90%"></div></div></div>
</div>

<a href="S2a-Stellen-leer.dc.html" class="scrim" aria-label="Suche schließen"></a>
<div class="sheet" role="dialog" aria-labelledby="su-t" style="top: 96px; display: flex; flex-direction: column; gap: 12px">
<div class="sheet-handle" aria-hidden="true" style="margin-bottom: 0"></div>
<div class="sheet-head" style="padding-bottom: 0">
<h2 id="su-t" class="t-h" style="flex: 1">Text suchen und schwärzen</h2>
<a href="S2a-Stellen-leer.dc.html" class="icon-btn glass" aria-label="Schließen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div class="field" style="padding: 0 8px">
<label for="q">Suchbegriff</label>
<div class="field-box is-focus"><span style="display: flex; align-items: center; padding-left: 14px; color: var(--fk-muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"></path></svg></span><input id="q" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="z. B. einen Namen oder eine Nummer" autocomplete="off" spellcheck="false" style="padding-left: 10px"></div>
</div>
<div class="fk-stack" style="flex: 1; min-height: 0; gap: 10px; padding: 0 8px">
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><p class="t-s t-muted">Durchsucht alle 12 Seiten. Geschwärzt werden nur die gesuchten Zeichen.</p></sc-if>
<sc-if value="{{isNone}}" hint-placeholder-val="{{ false }}"><div class="fk-stack" role="status" style="gap: 4px"><p class="t-l">Kein Treffer</p><p class="t-s t-muted">Prüfe die Schreibweise oder suche nach einem Teil des Wortes.</p></div></sc-if>
<sc-if value="{{isHits}}" hint-placeholder-val="{{ true }}">
<div class="fk-row" style="gap: 4px">
<p class="t-l t-num" role="status" style="flex: 1">{{summary}}</p>
<button type="button" class="btn-link" style="padding: 0 10px; margin: 0" onClick="{{all}}">Alle</button>
<button type="button" class="btn-link" style="padding: 0 10px; margin: 0" onClick="{{none}}">Keine</button>
</div>
<sc-if value="{{hasDone}}" hint-placeholder-val="{{ false }}"><p class="note" style="padding: 10px 12px; font-size: 13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--fk-success-text)"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{doneLabel}}</p></sc-if>
<div class="hits" role="group" aria-label="Treffer">
<sc-for list="{{hits}}" as="h" hint-placeholder-count="5">
<button type="button" class="hit {{h.cls}}" role="checkbox" aria-checked="{{h.checked}}" aria-disabled="{{h.dis}}" onClick="{{h.toggle}}">
<span class="cbox" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
<span class="hit-pg">{{h.pgLabel}}</span>
<span class="snip">{{h.a}}<mark>{{h.m}}</mark>{{h.b}}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="padding: 4px 8px 0">
<sc-if value="{{canGo}}" hint-placeholder-val="{{ true }}"><a href="S6-Nach-Suche.dc.html" class="btn btn-primary btn-block">{{cta}}</a></sc-if>
<sc-if value="{{cantGo}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-primary btn-block" disabled>Treffer schwärzen</button></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"q":{"editor":"text","default":"Mustermann"},"schon":{"editor":"boolean","default":false},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: (props && props.q != null) ? props.q : 'Mustermann', off: {} };
  }
  renderVals() {
    const schon = this.props.schon ?? false;
    const corpus = [
      { p: 1, t: 'Zwischen Erika Mustermann (Vermieterin) und Max Mustermann (Mieter) wird folgender Vertrag geschlossen:' },
      { p: 2, t: 'Kontoinhaber: Max Mustermann', done: true },
      { p: 2, t: 'Mieter: Max Mustermann, Musterweg 7, 12345 Musterstadt', done: true },
      { p: 2, t: 'E-Mail: max.mustermann@example.de' },
      { p: 5, t: 'Schlüsselübergabe an Herrn Mustermann am 01.04.' },
      { p: 9, t: 'Unterschrift: Max Mustermann' }
    ];
    const q = (this.state.q || '').trim();
    const hits = [];
    if (q.length >= 2) {
      const ql = q.toLowerCase();
      corpus.forEach((c, ci) => {
        const low = c.t.toLowerCase();
        let i = low.indexOf(ql);
        while (i >= 0) {
          let ws = c.t.lastIndexOf(' ', i - 1) + 1;
          let we = c.t.indexOf(' ', i + ql.length); if (we < 0) we = c.t.length;
          const prevStart = c.t.lastIndexOf(' ', ws - 2) + 1;
          const nextEnd = (() => { const n = c.t.indexOf(' ', we + 1); return n < 0 ? c.t.length : n; })();
          const lead = ws > 0 ? (prevStart > 0 ? '… ' : '') + c.t.slice(prevStart, ws) : '';
          const tail = we < c.t.length ? c.t.slice(we, nextEnd) + (nextEnd < c.t.length ? ' …' : '') : '';
          const id = ci + ':' + i;
          const done = schon && !!c.done;
          hits.push({ id, p: c.p, done, a: lead + c.t.slice(ws, i), m: c.t.slice(i, i + ql.length), b: c.t.slice(i + ql.length, we) + tail });
          i = low.indexOf(ql, i + ql.length);
        }
      });
    }
    const off = this.state.off;
    const list = hits.map((h) => {
      const checked = !h.done && !off[h.id];
      return {
        ...h,
        pgLabel: 'Seite ' + h.p,
        cls: (h.done ? 'is-done' : '') + (checked ? ' is-checked' : ''),
        checked: h.done ? 'true' : (checked ? 'true' : 'false'),
        dis: h.done ? 'true' : 'false',
        toggle: () => { if (h.done) return; this.setState({ off: { ...this.state.off, [h.id]: !this.state.off[h.id] } }); }
      };
    });
    const n = list.filter((h) => !h.done && !off[h.id]).length;
    const doneN = list.filter((h) => h.done).length;
    const pages = new Set(hits.map((h) => h.p)).size;
    return {
      q: this.state.q,
      setQ: (e) => this.setState({ q: e.target.value, off: {} }),
      hits: list,
      isEmpty: q.length < 2, isNone: q.length >= 2 && hits.length === 0, isHits: hits.length > 0,
      summary: hits.length + (hits.length === 1 ? ' Treffer' : ' Treffer') + ' auf ' + pages + (pages === 1 ? ' Seite' : ' Seiten'),
      hasDone: doneN > 0, doneLabel: doneN === 1 ? '1 Treffer ist schon geschwärzt' : doneN + ' Treffer sind schon geschwärzt',
      all: () => this.setState({ off: {} }),
      none: () => { const o = {}; hits.forEach((h) => { o[h.id] = true; }); this.setState({ off: o }); },
      canGo: n > 0, cantGo: n === 0,
      cta: n + ' Treffer schwärzen'
    };
  }
}
</script>
</body>
</html>
