body{margin:0;background:#060a13}

.pg.scan{background:#f2efe7;color:#3a3a36;transform:rotate(-.5deg) scale(1.01);filter:contrast(.92)}
.pg-top{display:flex;justify-content:flex-end;column-gap:.3em;font-family:system-ui,sans-serif;font-size:.8em;color:#94a3b8}
.pg-h{display:flex;flex-wrap:wrap;column-gap:.3em;font-weight:700;font-size:1.14em;margin-top:.35em}
.pg-p,.pg-l{display:flex;flex-wrap:wrap;column-gap:.3em}

.pg-sig{margin-top:auto;display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:.8em;color:#64748b}

<script type="text/x-dc" data-dc-script data-props='{"art":{"editor":"enum","options":["pdf","scan","bild"],"default":"pdf"},"start":{"editor":"enum","options":["leer","mitStellen","ziehen","zoom","nachSuche"],"default":"zoom"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const art = (props && props.art) || 'pdf';
    this.state = { pg: art === 'bild' ? 1 : 2, pages: {}, sel: null, out: null, draw: null, finger: null, hist: [], fut: [], toast: '', live: '', z: 1, zx: 0, zy: 0, zoomHint: false };
    this.pageEl = null;
    this.drag = null;
    this.seeded = false;
  }
  art() { return this.props.art ?? 'pdf'; }
  start() { return this.props.start ?? 'zoom'; }
  componentDidMount() {
    if (this.start() === 'leer') return;
    const go = () => this.seed();
    this.t1 = setTimeout(go, 150);
    this.t2 = setTimeout(go, 700);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(go, 40));
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.tt); clearTimeout(this.to); }
  box(rs) {
    if (!this.pageEl || !rs.length) return null;
    const R = this.pageEl.getBoundingClientRect();
    if (!R.width) return null;
    let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
    rs.forEach((q) => { l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom); });
    const px = 0.6, py = 0.3;
    return { x: (l - R.left) / R.width * 100 - px, y: (t - R.top) / R.height * 100 - py, w: (r - l) / R.width * 100 + 2 * px, h: (b - t) / R.height * 100 + 2 * py };
  }
  rectOf(ids) {
    if (!this.pageEl) return null;
    const rs = [];
    ids.forEach((id) => { const el = this.pageEl.querySelector('[data-w="' + id + '"]'); if (el) rs.push(el.getBoundingClientRect()); });
    return rs.length === ids.length ? this.box(rs) : null;
  }
  subRects(query) {
    if (!this.pageEl) return [];
    const out = [];
    const q = query.toLowerCase();
    this.pageEl.querySelectorAll('[data-w]').forEach((el) => {
      const node = el.firstChild;
      if (!node || node.nodeType !== 3) return;
      const txt = node.textContent.toLowerCase();
      let i = txt.indexOf(q);
      while (i >= 0) {
        const rg = document.createRange();
        rg.setStart(node, i); rg.setEnd(node, i + q.length);
        const b = this.box([rg.getBoundingClientRect()]);
        if (b) out.push(b);
        i = txt.indexOf(q, i + q.length);
      }
    });
    return out;
  }
  seed() {
    if (this.seeded) return;
    const s = this.start();
    if (this.art() === 'bild') {
      this.seeded = true;
      if (s !== 'leer') this.setState({ pages: { 1: [{ x: 23, y: 21, w: 40, h: 3.2 }, { x: 22, y: 31.5, w: 34, h: 3 }] }, sel: s === 'mitStellen' ? 0 : null });
      return;
    }
    const groups = [['k1', 'k2'], ['i1', 'i2', 'i3', 'i4', 'i5', 'i6'], ['m1', 'm2'], ['t1', 't2']];
    if (s === 'nachSuche') {
      const hits = this.subRects('mustermann');
      if (hits.length < 3) return;
      this.seeded = true;
      const pages = { 1: [{ x: 31, y: 18.2, w: 15, h: 2.6 }, { x: 62, y: 18.2, w: 15, h: 2.6 }], 2: hits.map((h) => ({ ...h, d: 1 })), 5: [{ x: 40, y: 34, w: 16, h: 2.6 }], 9: [{ x: 22, y: 81, w: 18, h: 2.6 }] };
      this.setState({ pages, hist: [{}], toast: '7 Stellen geschwärzt', live: '7 Stellen geschwärzt.' });
      this.tt = setTimeout(() => this.setState({ toast: '' }), 5000);
      return;
    }
    const st = groups.map((g) => this.rectOf(g)).filter(Boolean);
    if (st.length < groups.length) return;
    this.seeded = true;
    const pages = { 2: s === 'zoom' ? st.slice(0, 1) : st, 5: [{ x: 10, y: 30, w: 50, h: 3 }], 7: [{ x: 10, y: 20, w: 35, h: 3 }, { x: 10, y: 52, w: 60, h: 3 }] };
    if (s === 'mitStellen') { this.setState({ pages, sel: 1 }); return; }
    if (s === 'ziehen') {
      const e = st[3];
      const dr = { x: e.x, y: e.y, w: e.w * 0.62, h: e.h };
      this.setState({ pages: { ...pages, 2: st.slice(0, 3) }, draw: dr, finger: { x: dr.x + dr.w, y: dr.y + dr.h } });
      return;
    }
    if (s === 'zoom') { this.setState({ pages, z: 2, zx: -24, zy: -210, zoomHint: true }); }
  }
  cur() { return this.state.pages[this.state.pg] || []; }
  setCur(st, extra) { this.setState({ pages: { ...this.state.pages, [this.state.pg]: st }, ...(extra || {}) }); }
  commit(prevPages, st, extra) {
    this.setState({ pages: { ...this.state.pages, [this.state.pg]: st }, hist: [...this.state.hist, prevPages].slice(-50), fut: [], ...(extra || {}) });
  }
  pt(e) {
    const R = this.pageEl.getBoundingClientRect();
    return { x: (e.clientX - R.left) / R.width * 100, y: (e.clientY - R.top) / R.height * 100 };
  }
  down(e) {
    if (!this.pageEl) return;
    const t = e.target;
    if (!t.closest || t.closest('[data-del]')) return;
    const p = this.pt(e);
    const st = this.cur();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    if (this.state.finger) this.setState({ finger: null, draw: null });
    const h = t.closest('[data-h]');
    if (h && this.state.sel != null) { this.drag = { mode: 'r', c: h.getAttribute('data-h'), p0: p, o: { ...st[this.state.sel] }, prev: this.state.pages, moved: false }; return; }
    const s = t.closest('[data-s]');
    if (s) {
      const i = +s.getAttribute('data-s');
      this.drag = { mode: 'm', i, p0: p, o: { ...st[i] }, prev: this.state.pages, moved: false };
      if (this.state.sel !== i) this.setState({ sel: i, toast: '' });
      return;
    }
    const w = this.art() === 'pdf' ? t.closest('[data-w]') : null;
    this.drag = { mode: 'n', p0: p, word: w ? w.getAttribute('data-w') : null, moved: false };
  }
  move(e) {
    const d = this.drag;
    if (!d || !this.pageEl) return;
    const p = this.pt(e);
    const dx = p.x - d.p0.x, dy = p.y - d.p0.y;
    if (!d.moved && Math.hypot(dx, dy * 1.414) < 1.6 / this.state.z) return;
    d.moved = true;
    const cl = (v, a, b) => Math.max(a, Math.min(b, v));
    if (d.mode === 'n') {
      const x = cl(Math.min(p.x, d.p0.x), 0, 100), y = cl(Math.min(p.y, d.p0.y), 0, 100);
      this.setState({ draw: { x, y, w: Math.min(Math.abs(dx), 100 - x), h: Math.min(Math.abs(dy), 100 - y) }, sel: null, toast: '' });
      return;
    }
    const st = this.cur().slice();
    const o = d.o;
    if (d.mode === 'm') { st[d.i] = { ...o, x: cl(o.x + dx, 0, 100 - o.w), y: cl(o.y + dy, 0, 100 - o.h) }; this.setCur(st); return; }
    let x1 = o.x, y1 = o.y, x2 = o.x + o.w, y2 = o.y + o.h;
    if (d.c.indexOf('l') >= 0) x1 = cl(o.x + dx, 0, x2 - 1);
    if (d.c.indexOf('r') >= 0) x2 = cl(x2 + dx, x1 + 1, 100);
    if (d.c.indexOf('t') >= 0) y1 = cl(o.y + dy, 0, y2 - 0.6);
    if (d.c.indexOf('b') >= 0) y2 = cl(y2 + dy, y1 + 0.6, 100);
    st[this.state.sel] = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    this.setCur(st);
  }
  announce(n) { const where = this.art() === 'bild' ? ' auf dem Bild' : ' auf Seite ' + this.state.pg; return 'Stelle hinzugefügt. ' + n + (n === 1 ? ' Stelle' : ' Stellen') + where + '.'; }
  up() {
    const d = this.drag;
    this.drag = null;
    if (!d) return;
    if (d.mode === 'n') {
      const dr = this.state.draw;
      if (d.moved && dr && dr.w > 1 && dr.h > 0.6) {
        const prev = this.cur();
        const st = [...prev, { x: dr.x, y: dr.y, w: dr.w, h: dr.h }];
        this.commit(this.state.pages, st, { draw: null, sel: st.length - 1, live: this.announce(st.length) });
        return;
      }
      this.setState({ draw: null });
      if (!d.moved) {
        if (this.state.sel != null) { this.setState({ sel: null }); return; }
        if (d.word) {
          const r = this.rectOf([d.word]);
          if (r) { const prev = this.cur(); this.commit(this.state.pages, [...prev, r], { sel: null, live: this.announce(prev.length + 1) }); }
        }
      }
      return;
    }
    if (d.moved) this.setState({ hist: [...this.state.hist, d.prev].slice(-50), fut: [] });
  }
  del(i) {
    if (this.state.out != null) return;
    this.setState({ out: i, sel: null });
    clearTimeout(this.to);
    this.to = setTimeout(() => {
      const prev = this.cur();
      this.commit(this.state.pages, prev.filter((_, k) => k !== i), { out: null, toast: 'Stelle gelöscht', live: 'Stelle gelöscht.' });
      clearTimeout(this.tt);
      this.tt = setTimeout(() => this.setState({ toast: '' }), 5000);
    }, 160);
  }
  undo() {
    const h = this.state.hist;
    if (!h.length) return;
    const last = h[h.length - 1];
    this.setState({ pages: last, hist: h.slice(0, -1), fut: [...this.state.fut, this.state.pages], sel: null, toast: '', live: 'Rückgängig gemacht.' });
  }
  redo() {
    const f = this.state.fut;
    if (!f.length) return;
    const nx = f[f.length - 1];
    this.setState({ pages: nx, fut: f.slice(0, -1), hist: [...this.state.hist, this.state.pages], sel: null, live: 'Wiederholt.' });
  }
  key(i, e) {
    const st = this.cur().slice();
    const o = st[i];
    if (!o) return;
    const k = e.key, s = e.shiftKey;
