<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Seitenübersicht mit Stellen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
<link rel="stylesheet" href="./filekit-ergaenzung.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
.tgrid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;padding:4px 8px 8px;align-content:start}
.tgrid::-webkit-scrollbar{display:none}
.titem{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--fk-text-2)}
.thumb .tl{position:absolute;left:12%;height:2.2%;border-radius:1px;background:#e1e6ee}
</style>
</helmet>
<div class="fk-app">
<header class="fk-top" aria-hidden="true">
<div class="fk-top-row"><span></span><div class="fk-top-title"><b>Stellen schwärzen</b><span>Schritt 2 von 3</span></div><span></span></div>
<div class="fk-progress"><i style="width: 66.6%"></i></div>
</header>
<div aria-hidden="true" style="flex: 1; display: flex; justify-content: center; padding-top: 12px">
<div class="canvas-vp" style="width: 331px; height: 468px"><div class="doc" style="padding: 9% 8%; gap: 7px"><div class="ln h" style="width: 48%"></div><div class="ln"></div><div class="ln" style="width: 94%"></div><div class="ln" style="width: 62%"></div></div></div>
</div>

<a href="S3a-Stellen.dc.html" class="scrim" aria-label="Seitenübersicht schließen"></a>
<div class="sheet" role="dialog" aria-labelledby="se-t" style="top: 120px; display: flex; flex-direction: column; gap: 10px">
<div class="sheet-handle" aria-hidden="true" style="margin-bottom: 0"></div>
<div class="sheet-head" style="padding-bottom: 0">
<div class="fk-stack" style="flex: 1; gap: 2px"><h2 id="se-t" class="t-h">Seiten</h2><p class="t-s t-muted">7 Stellen auf 3 Seiten</p></div>
<a href="S3a-Stellen.dc.html" class="icon-btn glass" aria-label="Schließen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div class="tgrid" role="list">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="12">
<div class="titem" role="listitem">
<a href="S3a-Stellen.dc.html" class="thumb {{p.cls}}" aria-label="{{p.label}}" aria-current="{{p.cur}}">
<span class="tl" style="top: 10%; width: 50%"></span><span class="tl" style="top: 16%; width: 76%"></span><span class="tl" style="top: 21%; width: 70%"></span><span class="tl" style="top: 26%; width: 74%"></span><span class="tl" style="top: 36%; width: 40%"></span><span class="tl" style="top: 42%; width: 76%"></span><span class="tl" style="top: 47%; width: 66%"></span><span class="tl" style="top: 57%; width: 72%"></span><span class="tl" style="top: 62%; width: 58%"></span><span class="tl" style="top: 72%; width: 74%"></span>
<sc-for list="{{p.bars}}" as="b" hint-placeholder-count="0"><i style="left: {{b.l}}%; top: {{b.t}}%; width: {{b.w}}%"></i></sc-for>
<sc-if value="{{p.has}}" hint-placeholder-val="{{ false }}"><span class="thumb-badge"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="3" width="10" height="4" rx="1" fill="currentColor"></rect></svg>{{p.n}}</span></sc-if>
</a>
<span>Seite {{p.no}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = {
      2: [{ l: 26, t: 20.4, w: 34 }, { l: 12, t: 25.4, w: 66 }, { l: 22, t: 41.4, w: 34 }, { l: 22, t: 46.4, w: 30 }],
      5: [{ l: 12, t: 35.4, w: 50 }],
      7: [{ l: 12, t: 20.4, w: 36 }, { l: 12, t: 56.4, w: 60 }]
    };
    const pages = [];
    for (let no = 1; no <= 12; no++) {
      const b = bars[no] || [];
      pages.push({
        no, bars: b, n: b.length, has: b.length > 0,
        cls: no === 2 ? 'is-current' : '',
        cur: no === 2 ? 'page' : 'false',
        label: 'Seite ' + no + (b.length ? ', ' + b.length + (b.length === 1 ? ' Stelle' : ' Stellen') : ', keine Stellen') + (no === 2 ? ', aktuelle Seite' : '')
      });
    }
    return { pages };
  }
}
</script>
</body>
</html>
