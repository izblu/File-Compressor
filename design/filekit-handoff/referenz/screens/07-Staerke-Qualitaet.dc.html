<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Verkleinern – Stärke wählen (Qualität)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
</style>
</helmet>
<div class="fk-app">
<header class="fk-top">
<div class="fk-top-row">
<a href="03-Eine-Datei.dc.html" class="icon-btn" aria-label="Zurück"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div class="fk-top-title"><b>Wie stark verkleinern?</b><span>Schritt 2 von 3</span></div>
<a href="01-Start-leer.dc.html" class="icon-btn" aria-label="Abbrechen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div class="fk-progress" role="progressbar" aria-label="Schritt 2 von 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2"><i style="width: 66.6%"></i></div>
</header>
<main class="fk-body in-step fk-stack" style="gap: 16px; padding-top: 20px">
<div class="fk-row card" style="gap: 12px; padding: 10px 14px 10px 10px">
<div style="position: relative; width: 32px; height: 44px; flex: none"><div class="doc" style="padding: 5px 4px; gap: 2px; border-radius: 3px"><div class="ln d" style="width: 70%; height: 2px"></div><div class="ln" style="height: 2px"></div><div class="ln" style="height: 2px"></div><div class="ln" style="height: 2px; width: 60%"></div></div></div>
<div class="fk-stack" style="flex: 1; min-width: 0; gap: 1px"><span class="t-s" style="color: var(--fk-text)">Vertrag.pdf</span><span class="t-xs t-muted">12 Seiten</span></div>
<span class="t-l t-num">8,4 MB</span>
</div>
<nav class="seg" aria-label="Art der Verkleinerung">
<a href="07-Staerke-Qualitaet.dc.html" class="is-on" aria-current="page">Qualität</a>
<a href="07b-Staerke-Zielgroesse.dc.html">Zielgröße</a>
</nav>
<div class="fk-stack" role="radiogroup" aria-label="Stärke" style="gap: 10px">
<button type="button" role="radio" aria-checked="{{aStark}}" class="opt {{cStark}}" onClick="{{pickStark}}">
<span class="opt-vis" aria-hidden="true" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--fk-surface-3)"><span style="width: 14px; height: 19px; border-radius: 2px; background: #e6ecf8"></span></span>
<span class="opt-main"><span class="opt-title">Stark</span><span class="opt-sub">kleinste Datei</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
<button type="button" role="radio" aria-checked="{{aMittel}}" class="opt {{cMittel}}" onClick="{{pickMittel}}">
<span class="opt-vis" aria-hidden="true" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--fk-surface-3)"><span style="width: 20px; height: 27px; border-radius: 2.5px; background: #e6ecf8"></span></span>
<span class="opt-main"><span class="opt-title">Mittel <span class="badge badge-accent">empfohlen</span></span><span class="opt-sub">gute Balance</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
<button type="button" role="radio" aria-checked="{{aSchonend}}" class="opt {{cSchonend}}" onClick="{{pickSchonend}}">
<span class="opt-vis" aria-hidden="true" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--fk-surface-3)"><span style="width: 26px; height: 35px; border-radius: 3px; background: #e6ecf8"></span></span>
<span class="opt-main"><span class="opt-title">Schonend</span><span class="opt-sub">beste Qualität</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
</div>
<p class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Text ist danach nicht mehr markierbar.</p>
</main>
<footer class="fk-dock">
<a href="08-Verarbeiten.dc.html" class="btn btn-primary btn-block">Weiter</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'mittel' };
  }
  renderVals() {
    const q = this.state.q;
    const c = (k) => (q === k ? 'is-selected' : '');
    const a = (k) => (q === k ? 'true' : 'false');
    return {
      cStark: c('stark'), cMittel: c('mittel'), cSchonend: c('schonend'),
      aStark: a('stark'), aMittel: a('mittel'), aSchonend: a('schonend'),
      pickStark: () => this.setState({ q: 'stark' }),
      pickMittel: () => this.setState({ q: 'mittel' }),
      pickSchonend: () => this.setState({ q: 'schonend' })
    };
  }
}
</script>
</body>
</html>
