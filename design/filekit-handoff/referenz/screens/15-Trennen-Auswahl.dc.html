<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Trennen – Seiten auswählen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
.tile{width:100%;text-align:left;cursor:pointer;color:inherit}
.tile .doc{display:flex}
</style>
</helmet>
<div class="fk-app">
<header class="fk-top">
<div class="fk-top-row">
<a href="03-Eine-Datei.dc.html" class="icon-btn" aria-label="Zurück"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div class="fk-top-title"><b>Seiten auswählen</b><span>Schritt 2 von 3</span></div>
<a href="01-Start-leer.dc.html" class="icon-btn" aria-label="Abbrechen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div class="fk-progress" role="progressbar" aria-label="Schritt 2 von 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2"><i style="width: 66.6%"></i></div>
</header>
<main class="fk-body in-step fk-stack" style="gap: 12px; padding-top: 14px">
<div class="toolbar">
<p class="t-body t-num" aria-live="polite" style="flex: 1"><b>{{count}}</b> <span class="t-muted">von 12 ausgewählt</span></p>
<button type="button" class="btn-link" style="padding: 0 10px; margin: 0" onClick="{{all}}">Alle</button>
<button type="button" class="btn-link" style="padding: 0 10px; margin: 0" onClick="{{none}}">Keine</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="12">
<button type="button" class="tile {{p.cls}}" aria-pressed="{{p.pressed}}" aria-label="Seite {{p.n}}" onClick="{{p.toggle}}">
<span class="tile-page" style="display: block">
<span class="doc">
<sc-if value="{{p.first}}" hint-placeholder-val="{{ false }}"><span class="ttl">VERTRAG</span></sc-if>
<span class="ln h" style="width: 60%"></span>
<span class="ln" style="width: 100%"></span><span class="ln" style="width: 94%"></span><span class="ln" style="width: 97%"></span><span class="ln" style="width: 58%"></span>
<span class="gap"></span>
<span class="ln d" style="width: 22%"></span>
<span class="ln" style="width: 100%"></span><span class="ln" style="width: 91%"></span><span class="ln" style="width: 72%"></span>
</span>
</span>
<span class="tile-check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
<span class="tile-foot"><span class="tile-num">Seite {{p.n}}</span></span>
</button>
</sc-for>
</div>
</main>
<footer class="fk-dock">
<sc-if value="{{has}}" hint-placeholder-val="{{ true }}"><a href="16-Trennen-Speichern.dc.html" class="btn btn-primary btn-block">Weiter</a></sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-primary btn-block" disabled>Weiter</button></sc-if>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { 3: true, 4: true, 7: true } };
  }
  renderVals() {
    const sel = this.state.sel;
    const pages = [];
    for (let n = 1; n <= 12; n++) {
      const s = !!sel[n];
      pages.push({
        n, first: n === 1,
        cls: s ? 'is-selected' : '',
        pressed: s ? 'true' : 'false',
        toggle: () => this.setState({ sel: { ...this.state.sel, [n]: !s } })
      });
    }
    const count = pages.filter((p) => sel[p.n]).length;
    return {
      pages, count,
      has: count > 0,
      empty: count === 0,
      all: () => { const a = {}; for (let n = 1; n <= 12; n++) a[n] = true; this.setState({ sel: a }); },
      none: () => this.setState({ sel: {} })
    };
  }
}
</script>
</body>
</html>
