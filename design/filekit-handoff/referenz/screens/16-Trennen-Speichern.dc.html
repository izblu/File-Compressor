<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Trennen – Speichern</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
.ocard{flex-direction:column;align-items:stretch;gap:12px;padding:14px;position:relative}
.ocard .radio{position:absolute;top:12px;right:12px}
.vis{height:64px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:12px;background:var(--fk-surface-3)}
.pg{width:22px;height:30px;border-radius:3px;background:#e6ecf8;box-shadow:0 4px 8px -4px rgba(0,0,0,.6)}
.pg.pdf{background:#fff;box-shadow:inset 0 3px 0 #79a2ff,0 4px 8px -4px rgba(0,0,0,.6)}
</style>
</helmet>
<div class="fk-app">
<header class="fk-top">
<div class="fk-top-row">
<a href="15-Trennen-Auswahl.dc.html" class="icon-btn" aria-label="Zurück"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div class="fk-top-title"><b>Speichern</b><span>Schritt 3 von 3</span></div>
<a href="20c-Abbrechen.dc.html" class="icon-btn" aria-label="Abbrechen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div class="fk-progress" role="progressbar" aria-label="Schritt 3 von 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3"><i style="width: 100%"></i></div>
</header>
<main class="fk-body in-step fk-stack" style="gap: 20px; padding-top: 20px">
<section class="fk-stack" style="gap: 10px">
<h2 class="t-s t-2">Wie speichern? <span class="t-muted" style="font-weight: 500">· Seiten 3, 4, 7</span></h2>
<div role="radiogroup" aria-label="Ausgabe" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" role="radio" aria-checked="{{aEine}}" class="opt ocard {{cEine}}" onClick="{{pickEine}}">
<span class="vis opt-vis" aria-hidden="true"><span class="fk-row" style="gap: 3px"><span class="pg" style="width: 14px; height: 20px"></span><span class="pg" style="width: 14px; height: 20px"></span><span class="pg" style="width: 14px; height: 20px"></span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e9ab2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span class="pg pdf"></span></span>
<span class="opt-main"><span class="opt-title" style="font-size: 15px; line-height: 1.3">Ausgewählte Seiten in einer Datei</span><span class="opt-sub t-num">3 Seiten → 1 PDF</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
<button type="button" role="radio" aria-checked="{{aJede}}" class="opt ocard {{cJede}}" onClick="{{pickJede}}">
<span class="vis opt-vis" aria-hidden="true"><span class="pg pdf"></span><span class="pg pdf"></span><span class="pg pdf"></span></span>
<span class="opt-main"><span class="opt-title" style="font-size: 15px; line-height: 1.3">Jede Seite als eigene Datei</span><span class="opt-sub t-num">3 Seiten → 3 PDFs</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
</div>
</section>
<div class="field">
<label for="name">Dateiname</label>
<div class="field-box"><input id="name" value="{{name}}" onChange="{{setName}}" autocomplete="off" spellcheck="false"><span class="field-ext">.pdf</span></div>
</div>
<section class="fk-stack" style="gap: 8px">
<h2 class="t-s t-2">So heißen die Dateien</h2>
<div class="namelist" aria-live="polite">
<sc-for list="{{files}}" as="f" hint-placeholder-count="1"><span class="in-fade"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--fk-accent-text)"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"></path><path d="M14 3v5h5"></path></svg>{{f.label}}</span></sc-for>
</div>
</section>
</main>
<footer class="fk-dock">
<a href="18-Gespeichert.dc.html" class="btn btn-primary btn-block">{{cta}}</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'jede', name: 'Vertrag' };
  }
  renderVals() {
    const { mode, name } = this.state;
    const n = (name || '').trim() || 'Vertrag';
    const pages = [3, 4, 7];
    const files = mode === 'eine'
      ? [{ label: n + '_Seiten_3-4-7.pdf' }]
      : pages.map((p) => ({ label: n + '_Seite' + p + '.pdf' }));
    return {
      name, files,
      cEine: mode === 'eine' ? 'is-selected' : '',
      cJede: mode === 'jede' ? 'is-selected' : '',
      aEine: mode === 'eine' ? 'true' : 'false',
      aJede: mode === 'jede' ? 'true' : 'false',
      pickEine: () => this.setState({ mode: 'eine' }),
      pickJede: () => this.setState({ mode: 'jede' }),
      setName: (e) => this.setState({ name: e.target.value }),
      cta: mode === 'eine' ? 'Speichern' : 'Alle speichern (3)'
    };
  }
}
</script>
</body>
</html>
