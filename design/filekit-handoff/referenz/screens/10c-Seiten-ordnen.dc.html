<!doctype html>

<x-dc>

<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
</style>

<div class="fk-app">
<header class="fk-top">

</header>
<main class="fk-body in-step fk-stack" style="gap: 12px; padding-top: 14px">
<div class="toolbar">
<span class="t-s t-muted" style="flex: 1">Vertrag.pdf · 12 Seiten</span>
<a href="11-Mehrfachauswahl.dc.html" class="btn-link" style="padding: 0 10px">Auswählen</a>

</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="12">
<div class="tile {{p.cls}}">
<div class="tile-page">
<div class="doc">
<sc-if value="{{p.first}}" hint-placeholder-val="{{ false }}"><span class="ttl">VERTRAG</span></sc-if>
<span class="ln h" style="width: 60%"></span>
<span class="ln" style="width: 100%"></span><span class="ln" style="width: 94%"></span><span class="ln" style="width: 97%"></span><span class="ln" style="width: 58%"></span>

<span class="ln d" style="width: 22%"></span>
<span class="ln" style="width: 100%"></span><span class="ln" style="width: 91%"></span><span class="ln" style="width: 72%"></span>
</div>
</div>
<sc-if value="{{p.rot}}" hint-placeholder-val="{{ false }}"><span class="tile-rot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"></path></svg>90°</span></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const pages = [];
    for (let n = 1; n <= 12; n++) pages.push({ n, first: n === 1, rot: n === 4, cls: n === 4 ? 'is-rotated' : '' });
    return { pages };
  }
}
</script>
