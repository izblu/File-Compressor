<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Umwandeln – Speichern</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#060a13}
a{color:#79a2ff}a:hover{color:#9bbaff}
.fmt{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--fk-surface-3);font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--fk-text)}
.is-selected .fmt{background:var(--fk-accent);color:#fff;box-shadow:0 8px 18px -8px var(--fk-accent-glow)}
</style>
</helmet>
<div class="fk-app">
<header class="fk-top">
<div class="fk-top-row">
<a href="03-Eine-Datei.dc.html" class="icon-btn" aria-label="Zurück"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div class="fk-top-title"><b>Speichern</b><span>Schritt 2 von 2</span></div>
<a href="01-Start-leer.dc.html" class="icon-btn" aria-label="Abbrechen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div class="fk-progress" role="progressbar" aria-label="Schritt 2 von 2" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2"><i style="width: 100%"></i></div>
</header>
<main class="fk-body in-step fk-stack" style="gap: 20px; padding-top: 20px">
<section class="fk-stack" style="gap: 10px">
<h2 class="t-s t-2">Umwandeln in</h2>
<div class="fk-stack" role="radiogroup" aria-label="Format" style="gap: 10px">
<div class="opt is-disabled" role="radio" aria-checked="false" aria-disabled="true">
<span class="fmt opt-vis">PDF</span>
<span class="opt-main"><span class="opt-title">PDF</span><span class="mrow-why"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Ist bereits ein PDF</span></span>
</div>
<button type="button" role="radio" aria-checked="{{aJpg}}" class="opt {{cJpg}}" onClick="{{pickJpg}}">
<span class="fmt opt-vis">JPG</span>
<span class="opt-main"><span class="opt-title">JPG</span><span class="opt-sub">klein, für Fotos</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
<button type="button" role="radio" aria-checked="{{aPng}}" class="opt {{cPng}}" onClick="{{pickPng}}">
<span class="fmt opt-vis">PNG</span>
<span class="opt-main"><span class="opt-title">PNG</span><span class="opt-sub">verlustfrei, mit Transparenz</span></span>
<span class="radio" aria-hidden="true"></span>
</button>
</div>
</section>
<p class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg><span>Jede der 12 Seiten wird ein eigenes Bild.</span></p>
<div class="field">
<label for="name">Dateiname</label>
<div class="field-box"><input id="name" value="{{name}}" onChange="{{setName}}" autocomplete="off" spellcheck="false"><span class="field-ext">{{ext}}</span></div>
</div>
<div class="namelist" aria-label="Vorschau der Dateinamen">
<span>{{f1}}</span>
<span>{{f2}}</span>
<span class="t-muted" aria-hidden="true">…</span>
<span>{{f12}}</span>
</div>
</main>
<footer class="fk-dock">
<a href="18-Gespeichert.dc.html" class="btn btn-primary btn-block">Alle speichern (12)</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fmt: 'jpg', name: 'Vertrag' };
  }
  renderVals() {
    const { fmt, name } = this.state;
    const n = (name || '').trim() || 'Vertrag';
    const ext = '.' + fmt;
    return {
      name, ext,
      f1: n + '_Seite1' + ext, f2: n + '_Seite2' + ext, f12: n + '_Seite12' + ext,
      cJpg: fmt === 'jpg' ? 'is-selected' : '', cPng: fmt === 'png' ? 'is-selected' : '',
      aJpg: fmt === 'jpg' ? 'true' : 'false', aPng: fmt === 'png' ? 'true' : 'false',
      pickJpg: () => this.setState({ fmt: 'jpg' }),
      pickPng: () => this.setState({ fmt: 'png' }),
      setName: (e) => this.setState({ name: e.target.value })
    };
  }
}
</script>
</body>
</html>
