<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vollbild-Seitenansicht</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./filekit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#79a2ff}a:hover{color:#9bbaff}
.track{display:flex;height:100%;transition:transform 380ms cubic-bezier(.65,0,.35,1);touch-action:pan-y}
.slide{flex:none;width:375px;height:100%;display:flex;align-items:center;justify-content:center}
.dot{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.28);transition:all 300ms cubic-bezier(.2,.8,.2,1)}
.dot.on{width:20px;background:#fff}
@media (prefers-reduced-motion: reduce){.track{transition:none}}
</style>
</helmet>
<div class="fk-app" style="background: #000">
<header class="fk-row in-fade" style="position: relative; z-index: 2; padding: 49px 8px 0; gap: 8px">
<a href="10-Seiten-anordnen.dc.html" class="icon-btn glass" aria-label="Schließen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<p class="t-l t-num" aria-live="polite" style="flex: 1; text-align: center">Seite {{n}} von 5</p>
<span class="fk-row" style="width: 44px; justify-content: center"><span class="marker {{m}}">{{file}}</span></span>
</header>
<div class="in-card" style="flex: 1; min-height: 0; overflow: hidden" onPointerDown="{{down}}" onPointerUp="{{up}}">
<div class="track" style="transform: translateX({{tx}}px)">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="5">
<div class="slide">
<div style="position: relative; width: 327px; height: 462px; border-radius: 6px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.9), 0 0 80px -20px rgba(59,116,255,.35)">
<div class="doc {{p.paper}}" style="padding: 36px 30px; gap: 9px">
<sc-if value="{{p.isInv}}" hint-placeholder-val="{{ false }}"><span class="ttl" style="font-size: 15px">RECHNUNG</span><span class="blk" style="height: 14px; margin-top: 10px; background: #dbe5fb"></span></sc-if>
<span class="ln h" style="width: 54%; height: 7px"></span>
<span class="ln" style="height: 4px; width: 100%"></span><span class="ln" style="height: 4px; width: 92%"></span><span class="ln" style="height: 4px; width: 97%"></span><span class="ln" style="height: 4px; width: 66%"></span>
<span class="gap" style="height: 10px"></span>
<span class="ln" style="height: 4px; width: 100%"></span><span class="ln" style="height: 4px; width: 88%"></span><span class="ln" style="height: 4px; width: 95%"></span><span class="ln" style="height: 4px; width: 40%"></span>
<span class="gap" style="height: 10px"></span>
<span class="ln" style="height: 4px; width: 98%"></span><span class="ln" style="height: 4px; width: 76%"></span>
<span class="sig"><i></i><i></i></span>
</div>
</div>
</div>
</sc-for>
</div>
</div>
<footer class="fk-stack in-up d3" style="position: relative; z-index: 2; align-items: center; gap: 10px; padding: 12px 20px 30px">
<div class="fk-row" style="gap: 20px">
<button type="button" class="icon-btn glass" aria-label="Vorherige Seite" onClick="{{prev}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div class="fk-row" aria-hidden="true" style="gap: 6px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span class="dot {{d.cls}}"></span></sc-for></div>
<button type="button" class="icon-btn glass" aria-label="Nächste Seite" onClick="{{next}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
<p class="t-xs t-muted">Zum Blättern wischen</p>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 2 };
    this.x0 = null;
  }
  go(d) {
    const i = Math.max(0, Math.min(4, this.state.i + d));
    this.setState({ i });
  }
  renderVals() {
    const meta = [
      { file: 1, m: 'bg-m1', paper: 'scan', isInv: false },
      { file: 2, m: 'bg-m2', paper: 'scan', isInv: false },
      { file: 3, m: 'bg-m3', paper: '', isInv: true },
      { file: 3, m: 'bg-m3', paper: '', isInv: false },
      { file: 3, m: 'bg-m3', paper: '', isInv: false }
    ];
    const i = this.state.i;
    return {
      pages: meta,
      n: i + 1,
      file: meta[i].file,
      m: meta[i].m,
      tx: -i * 375,
      dots: meta.map((_, k) => ({ cls: k === i ? 'on' : '' })),
      prev: () => this.go(-1),
      next: () => this.go(1),
      down: (e) => { this.x0 = e.clientX; },
      up: (e) => {
        if (this.x0 == null) return;
        const dx = e.clientX - this.x0;
        this.x0 = null;
        if (dx < -40) this.go(1);
        else if (dx > 40) this.go(-1);
      }
    };
  }
}
</script>
</body>
</html>
