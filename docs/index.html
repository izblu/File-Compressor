<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FileKit – PDFs &amp; Bilder bearbeiten, direkt auf deinem Gerät</title>
  <meta name="description" content="PDFs und Bilder verkleinern, zusammenführen, trennen, ordnen und umwandeln – direkt auf deinem Gerät. Nichts verlässt dein Gerät." />

  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#060a13" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/app-icon-klein.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="preload" href="fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="filekit.css" />
  <link rel="stylesheet" href="filekit-ergaenzung.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Startscreen: Zustand "leer" steht hier fest im HTML (schneller erster Eindruck).
       Fehlerkarte und Dateiansicht setzt start.js in #zone ein. -->
  <div id="app" class="fk-app start">
    <header class="start-head fk-row">
      <svg class="start-logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="logoVerlauf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b78ff" /><stop offset="1" stop-color="#2257e0" /></linearGradient></defs>
        <rect width="64" height="64" rx="15" fill="url(#logoVerlauf)" />
        <rect x="11" y="15" width="29" height="22" rx="4" fill="#fff" />
        <circle cx="18" cy="21.5" r="2.7" fill="#2a63ec" />
        <path d="M13 35 L20 25.5 L25 32 L28.5 28 L33 35 Z" fill="#2a63ec" />
        <path d="M31 26h12l7 7v17a3 3 0 0 1-3 3H31a3 3 0 0 1-3-3V29a3 3 0 0 1 3-3z" fill="#fff" stroke="#2a63ec" stroke-width="2.5" />
        <path d="M33.5 38h12M33.5 42.5h12M33.5 47h8" stroke="#2a63ec" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span class="start-name">FileKit</span>
    </header>

    <h1 class="start-claim t-display">Deine PDFs &amp; Bilder – bearbeitet auf <span class="t-accent">deinem Gerät.</span></h1>

    <div id="zone" class="start-zone">
      <button id="dropzone" class="dz-ring" type="button">
        <span class="dz">
          <span class="dz-halo" aria-hidden="true"></span>
          <span class="dz-inner" aria-hidden="true"></span>
          <svg class="dz-art dz-art-ruhe" width="150" height="120" viewBox="0 0 140 112" aria-hidden="true">
            <g transform="rotate(-7 46 48)"><rect x="10" y="20" width="72" height="56" rx="11" fill="#14213f" stroke="#3b5aa0" stroke-width="1.5" /><circle cx="28" cy="38" r="6" fill="#2b4a8f" /><path d="M18 68 L38 44 L50 58 L58 49 L74 68 Z" fill="#2b4a8f" /></g>
            <g transform="rotate(4 84 66)"><path d="M62 28h30l18 18v48a8 8 0 0 1-8 8H62a8 8 0 0 1-8-8V36a8 8 0 0 1 8-8z" fill="#e6ecf8" /><path d="M92 28v12a6 6 0 0 0 6 6h12" fill="#9fb6e8" /><path d="M66 60h32M66 70h32M66 80h20" stroke="#9fb6e8" stroke-width="4" stroke-linecap="round" /></g>
            <circle cx="112" cy="94" r="16" fill="#2f6bf0" /><circle cx="112" cy="94" r="15.25" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" /><path d="M112 87v14M105 94h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          <svg class="dz-art dz-art-over" width="150" height="120" viewBox="0 0 140 112" aria-hidden="true">
            <g transform="rotate(-11 46 48)"><rect x="10" y="20" width="72" height="56" rx="11" fill="#14213f" stroke="#5b7fd0" stroke-width="1.5" /><circle cx="28" cy="38" r="6" fill="#2b4a8f" /><path d="M18 68 L38 44 L50 58 L58 49 L74 68 Z" fill="#2b4a8f" /></g>
            <g transform="rotate(8 84 66)"><path d="M62 28h30l18 18v48a8 8 0 0 1-8 8H62a8 8 0 0 1-8-8V36a8 8 0 0 1 8-8z" fill="#fff" /><path d="M92 28v12a6 6 0 0 0 6 6h12" fill="#9fb6e8" /><path d="M66 60h32M66 70h32M66 80h20" stroke="#9fb6e8" stroke-width="4" stroke-linecap="round" /></g>
            <circle cx="112" cy="94" r="18" fill="#2f6bf0" /><path d="M112 86v13M106 93l6 6 6-6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          </svg>
          <span class="dz-text dz-text-ruhe">
            <span class="dz-titel t-h">Datei wählen</span>
            <span class="dz-sub t-body t-muted">PDF oder Bild – auch mehrere</span>
            <span class="dz-oder t-s t-muted">oder hierher ziehen</span>
          </span>
          <span class="dz-text dz-text-over" aria-hidden="true">
            <span class="dz-titel t-h in-up">Loslassen zum Öffnen</span>
            <span class="dz-sub t-body t-2 in-up d1">Die Datei bleibt auf deinem Gerät.</span>
          </span>
          <span class="dz-text dz-text-busy" aria-hidden="true">
            <span class="spinner"></span>
            <span class="dz-titel t-h">Wird geöffnet …</span>
          </span>
        </span>
      </button>
    </div>

    <section class="start-features" aria-label="Das kann FileKit">
      <p class="t-micro t-muted">Das kann FileKit</p>
      <ul>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" stroke-dasharray="2.2 2.4" opacity=".6" /><path d="M7 12.5h3.5l2 2V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-4.5a2 2 0 0 1 2-2zM18.5 5.5 13.5 10.5M13.5 6.5v4h4" /></svg>Verkleinern</li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 17H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v2M16 6h-6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10l-4-4zM16 6v4h4M11 14.5h6M11 18h4" /></svg>Zusammen&shy;führen</li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12" /></svg>Trennen</li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3h5A1.5 1.5 0 0 1 11 4.5v7A1.5 1.5 0 0 1 9.5 13h-5A1.5 1.5 0 0 1 3 11.5v-7A1.5 1.5 0 0 1 4.5 3zM14.5 11h5a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5h-5a1.5 1.5 0 0 1-1.5-1.5v-7a1.5 1.5 0 0 1 1.5-1.5zM15 3h2a3 3 0 0 1 3 3v1M18 5.5 20 7.5 22 5.5M9 21H7a3 3 0 0 1-3-3v-1M6 18.5 4 16.5 2 18.5" /></svg>Seiten ordnen</li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8M3 3v5h5M3 12a9 9 0 0 0 15.5 6.2L21 16M21 21v-5h-5" /></svg>Umwandeln</li>
      </ul>
    </section>

    <footer class="trust start-trust">
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 11h9a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18.5v-5A2.5 2.5 0 0 1 7.5 11zM8 11V8a4 4 0 0 1 8 0v3" /></svg>privat</span>
      <span aria-hidden="true">·</span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 5.2-2.6M19 12.6a10 10 0 0 0-2.4-1.7M2 8.8a15 15 0 0 1 4.3-2.7M10.7 5.1A15 15 0 0 1 22 8.8M12 20h.01" /></svg>offline</span>
      <span aria-hidden="true">·</span>
      <span>
        <svg class="nur-handy" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 2h7A2.5 2.5 0 0 1 18 4.5v15a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 6 19.5v-15A2.5 2.5 0 0 1 8.5 2zM10.5 18h3" /></svg>
        <svg class="nur-pc" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 16v4" /></svg>
        Nichts verlässt dein Gerät
      </span>
    </footer>

    <input id="dateiwahl" type="file" accept="application/pdf,image/*" multiple hidden />
  </div>

  <!-- Ebene für Bottom Sheets, Dialoge und Toasts (liegt außerhalb von #app,
       damit #app beim Öffnen eines Sheets "inert" geschaltet werden kann). -->
  <div id="ebene"></div>
  <div id="toasts" class="toast-ebene" aria-live="polite"></div>
  <p id="ansage" class="sr-only" aria-live="polite"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
